<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Movimenti Bancari</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    .positivo {
      color: green;
    }
    .negativo {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Movimenti Bancari</h1>

  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Descrizione</th>
        <th>Importo</th>
        <th>Saldo</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>01/08/2025</td>
        <td>Bonifico ricevuto</td>
        <td class="positivo">+1.000,00 €</td>
        <td>5.000,00 €</td>
      </tr>
      <tr>
        <td>03/08/2025</td>
        <td>Pagamento bollette</td>
        <td class="negativo">-150,00 €</td>
        <td>4.850,00 €</td>
      </tr>
      <tr>
        <td>05/08/2025</td>
        <td>Acquisto supermercato</td>
        <td class="negativo">-75,50 €</td>
        <td>4.774,50 €</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
